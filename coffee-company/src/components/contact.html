<div class="c-contact">
    <div class="container-fluid">
        <!--الخريطة-->
        <div class="row">
            <div id="map-contact">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d11155.958687842021!2d46.6312690251544!3d24.756210657454304!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sar!2ssa!4v1749955753801!5m2!1sar!2ssa"
                    width="100%" height="250" frameborder="0" style="border:0;" allowfullscreen="" aria-hidden="false"
                    tabindex="0"></iframe>
            </div>
        </div>
        <div class="container">
            <div id="contact-options" class="row mb-4">

                <!--معلومات التواصل-->
                <div class="col-lg-4 offset-lg-2">
                    <h4 class="heading-with-border-bottom">
                        معلومات التواصل
                    </h4>
                    <div id="contact-info" class="mb-4">
                        <div>
                            <i class="fas fa-phone fa-lg"></i>
                            00966-500-557-333
                        </div>
                        <div>
                            <i class="fas fa-envelope fa-lg"></i>
                            info@coffee-company.com
                        </div>
                        <div>
                            <i class="fas fa-map-marker-alt fa-lg"></i>
                            العنوان: الرياض - حي العليا - شارع الملك فهد
                        </div>
                    </div>

                    <!--قسم ساعات العمل-->
                    <h4 class="heading-with-border-bottom">ساعات العمل</h4>
                    <div class="mb-4">
                        <div>
                            <i class="fas fa-clock fa-lg"></i>
                            من الأحد إلى الخميس: 9:00 صباحًا - 5:00 مساءً
                        </div>
                        <div>
                            <i class="fas fa-clock fa-lg"></i>
                            الجمعة والسبت: مغلق
                        </div>
                    </div>
                </div>
                <!--نهاية معلومات التواصل-->

                <!--قسم اترك رسالة-->
                <div class="col-lg-5">
                    <h4 class="pb-2">اترك رسالة</h4>
                    <form>
                        <div class="row">
                            <div class="col-md-6">
                                <input class="form-control custom-input-details custom-form-control" name="name"
                                    type="text" placeholder="الاسم" required>
                            </div>
                            <div class="col-md-6">
                                <input class="form-control custom-input-details custom-form-control" name="email"
                                    type="email" placeholder="البريد الإلكتروني" required>
                            </div>
                        </div>
                        <div class="mt-3">
                            <textarea class="form-control custom-input-details custom-form-control" name="message"
                                placeholder="نص الرسالة" required></textarea>
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn custom-btn-warning custom-btn-with-icon">
                                <span>
                                    إرسال الرسالة
                                    <i class="far fa-paper-plane"></i>
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
                <!--نهاية قسم اترك رسالة-->
            </div>
        </div>
    </div>
</div>
